[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "zpektral-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.156,<1",
    "uvicorn[standard]>=0.54,<1",
    "httpx>=0.28,<1",
    "sniffio>=1.3,<2",
    "pydantic>=2.14,<3",
    "pydantic-settings>=2.16,<3",
    "orjson>=3.13,<4",
    "sqlalchemy[asyncio]>=2.1,<3",
    "asyncpg>=0.32,<1",
    "alembic>=1.20,<2",
    "aiosqlite>=0.22,<1",
]

[project.optional-dependencies]
navegador = ["playwright>=1.55,<2"]
dev = [
    "pytest>=9.1,<10",
    "pytest-asyncio>=1.4,<2",
    "respx>=0.23,<1",
    "ruff>=0.17,<1",
    "hypothesis>=6.140,<7",
]

[tool.setuptools]
packages = ["app", "app.api", "app.api.rotas", "app.fontes", "app.navegador"]

[tool.setuptools.package-data]
app = ["dados/*.json"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["testes"]
python_files = ["teste_*.py"]
python_classes = ["Teste*"]
python_functions = ["teste_*"]
markers = ["live: consulta as lojas de verdade (rode com -m live)"]
addopts = "-m 'not live'"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003", "SIM905"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]
